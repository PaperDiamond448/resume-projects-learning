<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验器材状态 - 海洋信息实验教学平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@400;700&display=swap');
        body {
            font-family: 'Roboto', 'Microsoft Yahei', sans-serif;
            background: linear-gradient(135deg, #0a1d37 0%, #1e3a8a 100%);
            color: #e5e7eb;
            overflow-x: hidden;
        }
        .wave-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .wave {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/85486/wave.svg') repeat-x;
            animation: wave 12s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
            opacity: 0.6;
            background-size: 1000px 120px;
        }
        .wave:nth-child(2) {
            bottom: -30px;
            animation: wave 12s cubic-bezier(0.36, 0.45, 0.63, 0.53) -4s infinite;
            opacity: 0.4;
        }
        @keyframes wave {
            0% { transform: translateX(0); }
            50% { transform: translateX(-25%); }
            100% { transform: translateX(0); }
        }
        .sonar-wave {
            position: fixed;
            width: 50px;
            height: 50px;
            border: 2px solid rgba(96, 165, 250, 0.4);
            border-radius: 50%;
            animation: sonar 2s ease-out infinite;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .sonar-wave:nth-child(2) { animation-delay: 0.5s; }
        .sonar-wave:nth-child(3) { animation-delay: 1s; }
        @keyframes sonar {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(5);
                opacity: 0;
            }
        }
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0.5;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(1.2);
                opacity: 0;
            }
        }
        nav {
            background: rgba(10, 29, 55, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        nav a, nav button {
            transition: all 0.3s ease;
            position: relative;
        }
        nav a:hover, nav button:hover {
            color: #60a5fa;
            transform: translateY(-2px);
        }
        nav a::after, nav button::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #60a5fa;
            transition: width 0.3s ease;
        }
        nav a:hover::after, nav button:hover::after {
            width: 100%;
        }
        .equipment-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .equipment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .status-available { background-color: #22c55e; }
        .status-occupied { background-color: #facc15; }
        .status-fault { background-color: #ef4444; }
        .tech-btn {
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .tech-btn:hover {
            background: linear-gradient(90deg, #60a5fa, #2563eb);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.7);
        }
        .tech-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }
        .tech-btn:hover::before {
            left: 100%;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .time-slot {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .time-slot:hover {
            transform: scale(1.02);
        }
        .time-slot.available { background-color: #22c55e; }
        .time-slot.occupied { background-color: #facc15; }
        .time-slot.fault { background-color: #ef4444; }
    </style>
</head>
<body class="relative">
    <div class="wave-bg">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="sonar-wave"></div>
        <div class="sonar-wave"></div>
        <div class="sonar-wave"></div>
    </div>

    <nav class="sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between px-4 py-3">
            <div class="flex items-center space-x-4">
                <img src="assets/logo.png" alt="Ocean Share Edu Logo" class="h-auto" style="width: 120px; margin-right: 1rem;">
                <div class="menu-icon block md:hidden">☰</div>
                <div class="nav-links hidden md:flex space-x-6">
                    <a href="index.html" class="text-white font-medium">主页</a>
                    <a href="index.html#courses" class="text-white font-medium">课程分类</a>
                    <a href="index.html#features" class="text-white font-medium">平台特色</a>
                    <a href="index.html#about" class="text-white font-medium">关于我们</a>
                    <a href="equipment_status.html" class="text-blue-400 font-medium">实验器材状态</a>
                    <a href="personal_center.html" class="text-white font-medium">个人中心</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button id="authBtn" class="text-white font-medium">登录</button>
                <div class="w-8 h-8 bg-white rounded-full"></div>
            </div>
        </div>
    </nav>

    <section class="container mx-auto px-4 py-16">
        <h1 class="text-3xl font-bold text-white text-center mb-12" style="font-family: 'Orbitron', sans-serif;">实验器材状态</h1>
        <div class="grid gap-8 md:grid-cols-3">
            <div class="equipment-card p-6 rounded-lg">
                <h2 class="text-xl font-semibold text-white mb-4">实验池 1</h2>
                <div class="flex items-center mb-4">
                    <span class="w-4 h-4 rounded-full mr-2" id="status1"></span>
                    <span id="statusText1" class="text-gray-300"></span>
                </div>
                <button class="tech-btn" onclick="reserveEquipment(1)">预约</button>
            </div>
            <div class="equipment-card p-6 rounded-lg">
                <h2 class="text-xl font-semibold text-white mb-4">实验池 2</h2>
                <div class="flex items-center mb-4">
                    <span class="w-4 h-4 rounded-full mr-2" id="status2"></span>
                    <span id="statusText2" class="text-gray-300"></span>
                </div>
                <button class="tech-btn" onclick="reserveEquipment(2)">预约</button>
            </div>
            <div class="equipment-card p-6 rounded-lg">
                <h2 class="text-xl font-semibold text-white mb-4">实验池 3</h2>
                <div class="flex items-center mb-4">
                    <span class="w-4 h-4 rounded-full mr-2" id="status3"></span>
                    <span id="statusText3" class="text-gray-300"></span>
                </div>
                <button class="tech-btn" onclick="reserveEquipment(3)">预约</button>
            </div>
        </div>
    </section>

    <!-- 弹窗 -->
    <div id="reservationModal" class="modal">
        <div class="modal-content">
            <h2 class="text-xl font-semibold text-white mb-4">选择预约时间段</h2>
            <div id="timeSlots" class="text-gray-300"></div>
            <button class="tech-btn mt-4" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <footer class="bg-[#0a1d37] text-gray-400 text-center py-6">
        <p>© 2025 海洋信息实验教学平台. 保留所有权利.</p>
    </footer>

    <script>
        // 使用相对路径，自动适应当前域名
        // const baseUrl = 'https://together-shark-hardy.ngrok-free.app';

        // WebSocket 连接
        let ws;

        function connectWebSocket() {
            ws = new WebSocket('wss://together-shark-hardy.ngrok-free.app');
            ws.onopen = () => {
                console.log('WebSocket 连接成功');
                const user_id = localStorage.getItem('user_id');
                if (user_id) {
                    ws.send(JSON.stringify({ type: 'user_connect', user_id: user_id }));
                    console.log(`发送 user_connect 消息: user_id=${user_id}`);
                }
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'reservation_cancelled') {
                    console.log(`收到预约取消通知: equipment_id=${data.equipment_id}`);
                    fetchEquipmentStatus();
                }
            };
            ws.onclose = () => {
                console.log('WebSocket 连接关闭，尝试重连...');
                setTimeout(connectWebSocket, 5000);
            };
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
            };
        }

        // 更新导航栏状态
        function updateNav() {
            const authBtn = document.getElementById('authBtn');
            const user_id = localStorage.getItem('user_id');
            if (user_id) {
                authBtn.textContent = '退出';
                authBtn.onclick = () => {
                    localStorage.removeItem('user_id');
                    alert('已退出登录');
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.close();
                    }
                    updateNav();
                };
            } else {
                authBtn.textContent = '登录';
                authBtn.onclick = () => {
                    window.location.href = 'index.html';
                };
            }
        }

        // 查询实验器材状态
        async function fetchEquipmentStatus() {
            try {
                const response = await fetch(`/equipment-status`);
                if (!response.ok) {
                    throw new Error(`HTTP 错误: ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                data.forEach(equipment => {
                    const statusElement = document.getElementById(`status${equipment.id}`);
                    const statusText = document.getElementById(`statusText${equipment.id}`);
                    statusElement.className = `w-4 h-4 rounded-full mr-2 status-${equipment.status}`;
                    statusText.textContent = equipment.status === 'available' ? '可用' : equipment.status === 'occupied' ? '被占用' : '故障';
                });
            } catch (error) {
                console.error('获取实验器材状态失败:', error.message);
                console.error('错误详情:', error);
                alert('无法获取实验器材状态，请稍后重试');
            }
        }

        // 查询所有预约记录
        async function fetchReservations(equipmentId) {
            try {
                const currentDate = new Date().toISOString().split('T')[0];
                const response = await fetch(`/check-all-reservations?equipment_id=${equipmentId}&date=${currentDate}`);
                if (!response.ok) throw new Error(`无法获取预约记录: ${response.status} ${response.statusText}`);
                return await response.json();
            } catch (error) {
                console.error('获取预约记录失败:', error.message);
                return [];
            }
        }

        // 检查用户当前预约情况（防止重复预约）
        async function checkUserReservations(user_id) {
            try {
                const response = await fetch(`/user-reservations?user_id=${user_id}`);
                if (!response.ok) throw new Error(`无法检查用户预约: ${response.status} ${response.statusText}`);
                const data = await response.json();
                return data.reservations || [];
            } catch (error) {
                console.error('检查用户预约失败:', error.message);
                return [];
            }
        }

        // 打开弹窗并显示时间段
        async function reserveEquipment(equipmentId) {
            const user_id = localStorage.getItem('user_id');
            if (!user_id) {
                alert('请先登录');
                window.location.href = 'index.html';
                return;
            }

            const reservations = await checkUserReservations(user_id);
            if (reservations.length > 0) {
                alert('您已经预约了一个实验池！请先取消其他预约后再预约新的实验池。');
                return;
            }

            const statusResponse = await fetch(`/equipment-status`);
            const equipmentList = await statusResponse.json();
            const selectedEquipment = equipmentList.find(equip => equip.id === equipmentId);
            const isFault = selectedEquipment?.status === 'fault';

            const currentDate = new Date().toISOString().split('T')[0];
            const reservationData = await fetchReservations(equipmentId);

            const timeSlotsContainer = document.getElementById('timeSlots');
            timeSlotsContainer.innerHTML = '';
            for (let hour = 0; hour < 24; hour++) {
                const startHour = hour.toString().padStart(2, '0');
                const endHour = (hour + 1).toString().padStart(2, '0');
                const timeSlot = `${startHour}:00-${endHour}:00`;

                let isOccupied = false;
                for (const reservation of reservationData) {
                    const [start, end] = reservation.time_slot.split('-');
                    const [startH, startM] = start.split(':').map(Number);
                    const [endH, endM] = end.split(':').map(Number);
                    const slotStartHour = Number(startHour);
                    const slotEndHour = Number(endHour);
                    const resStartHour = startH + (startM > 0 ? 0.5 : 0);
                    const resEndHour = endH + (endM > 0 ? 0.5 : 0);

                    if (
                        (slotStartHour >= resStartHour && slotStartHour < resEndHour) ||
                        (slotEndHour > resStartHour && slotEndHour <= resEndHour) ||
                        (slotStartHour <= resStartHour && slotEndHour >= resEndHour)
                    ) {
                        isOccupied = true;
                        break;
                    }
                }

                let statusClass = 'available';
                if (isFault) {
                    statusClass = 'fault';
                } else if (isOccupied) {
                    statusClass = 'occupied';
                }

                const slotElement = document.createElement('div');
                slotElement.className = `time-slot ${statusClass}`;
                slotElement.textContent = timeSlot;
                if (statusClass === 'available') {
                    slotElement.onclick = () => {
                        reserveTimeSlot(equipmentId, user_id, currentDate, timeSlot);
                    };
                } else {
                    slotElement.style.cursor = 'not-allowed';
                }
                timeSlotsContainer.appendChild(slotElement);
            }

            const modal = document.getElementById('reservationModal');
            modal.style.display = 'flex';
        }

        // 预约特定时间段
        async function reserveTimeSlot(equipmentId, userId, date, timeSlot) {
            try {
                const response = await fetch(`/reserve-equipment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        equipment_id: equipmentId,
                        date: date,
                        time_slot: timeSlot
                    })
                });
                const data = await response.json();
                if (data.success) {
                    alert('预约成功！');
                    closeModal();
                    fetchEquipmentStatus();
                } else {
                    alert(data.error || '预约失败，请重试');
                }
            } catch (error) {
                console.error('预约失败:', error.message);
                alert('预约失败，请稍后重试');
            }
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('reservationModal');
            modal.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateNav();
            fetchEquipmentStatus();
            connectWebSocket();
            createBubbles();
        });

        // 气泡和声波效果
        function createBubbles() {
            const waveBg = document.querySelector('.wave-bg');
            for (let i = 0; i < 30; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 10 + 5;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDuration = `${Math.random() * 10 + 10}s`;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                waveBg.appendChild(bubble);
            }
        }

        const sonarWaves = document.querySelectorAll('.sonar-wave');
        document.addEventListener('mousemove', (e) => {
            sonarWaves.forEach(wave => {
                wave.style.left = `${e.clientX}px`;
                wave.style.top = `${e.clientY}px`;
            });
        });

        // 汉堡菜单功能
        const menuIcon = document.querySelector('.menu-icon');
        const navLinks = document.querySelector('.nav-links');
        if (menuIcon) {
            menuIcon.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
